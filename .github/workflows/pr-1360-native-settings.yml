name: Minutes 1360 native Settings
on:
  push:
    branches: [verify/pr-1360-native-settings]
permissions:
  contents: read
env:
  PR_SHA: 76d7ae465687dcc0cc61e50b0eba6bc0335f65c8
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  native-settings:
    name: Install and click-test Minutes Dev (macOS Intel)
    runs-on: macos-15-intel
    timeout-minutes: 90
    env:
      MINUTES_BUILD_FEATURES: parakeet,metal
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Select the SDK used by the repo’s Intel acceptance job
        run: |
          test -d /Applications/Xcode_26.3.app/Contents/Developer
          echo "DEVELOPER_DIR=/Applications/Xcode_26.3.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: Check exact PR source and prepare evidence directory
        run: |
          git merge-base --is-ancestor "$PR_SHA" HEAD
          test "$(uname -m)" = x86_64
          git diff --exit-code "$PR_SHA" HEAD -- . ':!.github/workflows/pr-1360-native-settings.yml' ':!scripts/pr-1360-native-settings.swift'
          mkdir "$RUNNER_TEMP/native-settings"
          {
            printf 'PR source SHA %s\n' "$PR_SHA"
            sw_vers
            uname -m
            xcodebuild -version
          } | tee "$RUNNER_TEMP/native-settings/environment.log"
      - name: Compile the native click-through harness
        run: |
          swiftc scripts/pr-1360-native-settings.swift -o "$RUNNER_TEMP/minutes-settings-check"
      - name: Install the repo-pinned Tauri CLI
        run: cargo install tauri-cli --version 2.10.1 --locked
      - name: Run the repository dev-app installer
        run: |
          set -o pipefail
          ./scripts/install-dev-app.sh --no-open 2>&1 | tee "$RUNNER_TEMP/native-settings/install.log"
          codesign --verify --deep --strict "$HOME/Applications/Minutes Dev.app"
      - name: Click through the installed app and save screenshots
        run: |
          set -o pipefail
          proof="$RUNNER_TEMP/native-settings"
          profile="$RUNNER_TEMP/minutes-settings-profile"
          mkdir -p "$profile/meetings"
          export MINUTES_CONFIG_PATH="$profile/config.toml"
          export MINUTES_DATA_DIR="$profile/data"
          printf 'output_dir = "%s"\n[privacy]\nhide_from_screen_share = false\n' "$profile/meetings" > "$MINUTES_CONFIG_PATH"
          "$HOME/Applications/Minutes Dev.app/Contents/MacOS/minutes-app" > "$proof/app.log" 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          "$RUNNER_TEMP/minutes-settings-check" "$app_pid" "$proof" "$MINUTES_CONFIG_PATH" 2>&1 | tee "$proof/click-through.log"
      - name: Upload native screenshots and logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: minutes-1360-settings-macos-intel
          path: ${{ runner.temp }}/native-settings/
          if-no-files-found: error
